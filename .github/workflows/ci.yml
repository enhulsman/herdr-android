name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RUST_TOOLCHAIN: "1.95.0"
  NDK_VERSION: "27.1.12297006"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The SSH tests (crates/herdr-mobile/tests/sshd.rs) start a throwaway sshd.
      - run: sudo apt-get install -y --no-install-recommends openssh-server > /dev/null
      - run: cargo test --locked
        env:
          HERDR_REQUIRE_SSHD: "1"
      - run: scripts/test-check-release-tag.sh
      - run: scripts/test-release-sign-gate.sh
      - run: scripts/test-fetch-herdr-core.sh
      - run: scripts/test-check-restricted-key.sh
        env:
          HERDR_REQUIRE_SSHD: "1"

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories licenses sources

  # Scratch-core and sshd tests against the oldest supported and the latest core.
  core:
    uses: ./.github/workflows/core-tests.yml
    with:
      cache: true

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JDK 17, Android NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --target aarch64-linux-android,x86_64-linux-android
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The open-source provider; the default one is proprietary.
          cache-provider: basic

      - name: Unit tests and debug APK (builds the Rust core through scripts/build-rust-android.sh)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug :app:assembleDebug
