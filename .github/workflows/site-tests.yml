# The website's build and browser checks (site/tests/site.test.mjs): npm test
# builds the site, serves it with a local `wrangler dev` (no account, no login)
# and checks every page in Chromium. Called by CI.
name: Site tests

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: site

jobs:
  test:
    name: site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      # The browser that matches the pinned playwright, headless shell only.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test
