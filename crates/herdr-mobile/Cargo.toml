[package]
name = "herdr-mobile"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "herdr_mobile"
crate-type = ["cdylib", "lib"]

[features]
# Links libghostty-vt from build/ghostty/ (scripts/build-ghostty.sh); see build.rs.
vt = []

[dependencies]
herdr-proto = { path = "../herdr-proto" }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
russh = { version = "0.65.0", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
uniffi.workspace = true

[dev-dependencies]
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std", "pkcs8", "pem"] }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
