[package]
name = "herdr-proto"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
