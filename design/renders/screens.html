<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herdr Android renders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Colours: herdr-app settings.rs presets run through resolve(). Do not hand-edit. */
.graphite{
  --bg:#17191d; --chrome:#101114; --canvas:#131518; --popover:#25272b; --raised:#2c2e31;
  --hover:#ffffff0e; --selected:#ffffff17; --border:#ffffff18; --input:#ffffff24;
  --fg:#eeeeef; --term-fg:#d2d4d9; --muted:#98999b; --dim:#696a6d; --idle:#696a6d; --ring:#aeaeb0;
  --accent:#96b2d7; --solid:#eeeeef; --solid-fg:#111215; --selection:#394454;
  --working:#e5c07b; --blocked:#f0705f; --done:#76a8ff;
  --a0:#45484f;--a1:#dc8c95;--a2:#a6bd91;--a3:#d8be87;--a4:#96b2d7;--a5:#b5a2ce;--a6:#8cbdc3;--a7:#d2d4d9;
  --a8:#818793;--a9:#f0a5ad;--a10:#bad5a2;--a11:#ead2a1;--a12:#b0cbef;--a13:#cbb7e6;--a14:#a4d5db;--a15:#f0f0f2;
  --kb:#1b1c1f; --kb-key:#2e3034; --kb-fn:#26282b; color-scheme:dark;
}
.paper{
  --bg:#ffffff; --chrome:#f1f1ee; --canvas:#fafaf9; --popover:#ffffff; --raised:#f6f6f6;
  --hover:#0000000c; --selected:#00000012; --border:#00000017; --input:#00000026;
  --fg:#1b1b1e; --term-fg:#25272c; --muted:#69696a; --dim:#969698; --idle:#a8a8aa; --ring:#5f5f62;
  --accent:#1f62d0; --solid:#1b1b1e; --solid-fg:#ffffff; --selection:#cfdcf5;
  --working:#9a6700; --blocked:#c93c2c; --done:#2f6fe4;
  --a0:#25272c;--a1:#c62a2a;--a2:#1a7f37;--a3:#8f5d00;--a4:#1f62d0;--a5:#7a45c8;--a6:#0f6f74;--a7:#5f6068;
  --a8:#7b7e87;--a9:#d1242f;--a10:#1f883d;--a11:#9a6700;--a12:#0969da;--a13:#8250df;--a14:#1b7c83;--a15:#111214;
  --kb:#e8eaed; --kb-key:#ffffff; --kb-fn:#d3d6db; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:#0b0c0e}
body{font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.gallery{display:flex;flex-wrap:wrap;gap:40px;padding:40px}
.frame{display:flex;flex-direction:column;gap:12px}
.frame>h2{margin:0;font:500 13px Geist,sans-serif;color:#98999b}
body.single{padding:0}
body.single .frame>h2{display:none}
.phone{width:412px;height:915px;position:relative;overflow:hidden;background:var(--chrome);color:var(--fg);display:flex;flex-direction:column;font-size:16px}
.mono{font-family:"JetBrains Mono",monospace}
button{font-family:inherit;color:inherit}

/* Android system bars (drawn by the system, shown for context) */
.sysbar{height:36px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:14px;font-weight:500;color:var(--fg)}
.sysicons{display:flex;gap:6px;align-items:center}
.sysicons i{display:block;background:currentColor;border-radius:2px}
.navbar{height:28px;flex:none;display:flex;align-items:center;justify-content:center}
.navbar span{width:108px;height:4px;border-radius:2px;background:var(--fg);opacity:.55}

/* Top bar */
.top{height:60px;flex:none;display:flex;align-items:center;padding:0 8px 0 20px;gap:4px}
.top h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;flex:1}
.iconbtn{width:48px;height:48px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.iconbtn svg{width:22px;height:22px}
.iconbtn .badge{position:absolute;top:11px;right:11px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--idle);background:var(--chrome)}

/* Machine notice line */
.notice{margin:0 16px 4px;height:36px;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:13px;color:var(--muted);background:var(--hover)}
.ring{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--idle);flex:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* List */
.list{flex:1;overflow:hidden;padding:0 8px}
.sec{height:40px;padding:12px 12px 0;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500}
.sec .n{color:var(--dim)}
.sec .grow{flex:1}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 12px;border-radius:12px}
.row .ic{width:20px;height:20px;flex:none}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-size:13px;color:var(--dim);flex:none}
.row.idle .name{color:var(--muted)}
.st{flex:none;width:18px;display:flex;align-items:center;justify-content:center}
.st .spin{width:15px;height:15px;color:var(--working)}
.st .done{width:9px;height:9px;border-radius:50%;background:var(--done)}
.st .idle{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--idle)}
.bar{height:3px;border-radius:2px;background:var(--border);margin-top:4px;width:150px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--working)}
.offline{font-size:11.5px;color:var(--dim);border:1px solid var(--border);border-radius:5px;padding:1px 6px;flex:none}

/* Signature: the needs-you card */
.card{margin:4px 0 8px;border-radius:14px;background:var(--popover);border:1px solid var(--border);border-left:3px solid var(--blocked);padding:12px 14px 13px 13px;display:flex;flex-direction:column;gap:10px}
.card .head{display:flex;align-items:center;gap:12px}
.card .ask{border-radius:9px;background:var(--canvas);padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.card .kind{font-size:12px;font-weight:600;color:var(--blocked);letter-spacing:.01em}
.card .msg{font-family:"JetBrains Mono",monospace;font-size:13px;line-height:1.45;color:var(--term-fg)}
.pill{height:22px;padding:0 8px;border-radius:6px;font-size:12.5px;font-weight:600;display:flex;align-items:center;flex:none}
.pill.blocked{background:color-mix(in srgb,var(--blocked) 15%,transparent);color:var(--blocked)}

/* Terminal screen */
.ttop{flex:none;display:flex;align-items:center;gap:6px;height:64px;padding:0 12px 0 4px;background:var(--chrome)}
.ttop .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ttop .name{font-size:17px;font-weight:500}
.ttop .sub{font-size:13px;color:var(--dim)}
.queue{flex:none;height:34px;display:flex;align-items:center;gap:8px;padding:0 14px 0 13px;font-size:13px;border-left:3px solid var(--blocked);background:color-mix(in srgb,var(--blocked) 9%,var(--chrome));border-top:1px solid var(--border)}
.queue b{font-weight:600;color:var(--blocked)}
.queue .rest{color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue svg{width:16px;height:16px;color:var(--muted)}
.term{font-variant-ligatures:none;flex:1;padding:6px 10px 0;box-sizing:border-box;background:var(--bg);color:var(--term-fg);font-family:"JetBrains Mono",monospace;white-space:pre;overflow:hidden;position:relative}
.term .l{display:block;height:1.25em;line-height:1.25em}
.c1{color:var(--a1)}.c2{color:var(--a2)}.c3{color:var(--a3)}.c4{color:var(--a4)}.c5{color:var(--a5)}.c6{color:var(--a6)}.c8{color:var(--a8)}.c9{color:var(--a9)}.c15{color:var(--a15)}
.bgadd{background:color-mix(in srgb,var(--a2) 16%,transparent)}.bgdel{background:color-mix(in srgb,var(--a1) 16%,transparent)}
.bold{font-weight:700}
.cursor{background:var(--term-fg);color:var(--bg)}
.chip{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;height:40px;padding:0 16px;border-radius:20px;background:var(--popover);border:1px solid var(--border);display:flex;align-items:center;gap:8px;font-family:Geist,sans-serif;font-size:13.5px;color:var(--muted);white-space:nowrap;box-shadow:0 6px 20px #0006}
.chip b{color:var(--fg);font-weight:500}
.chip svg{width:16px;height:16px}
.sizetag{position:absolute;right:8px;top:6px;font-family:Geist,sans-serif;font-size:11.5px;color:var(--dim);background:var(--canvas);border:1px solid var(--border);border-radius:6px;padding:2px 7px}

/* Keys row */
.keys{flex:none;height:48px;display:flex;gap:4px;padding:4px 6px;background:var(--chrome);border-top:1px solid var(--border)}
.key{flex:1;border-radius:8px;background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:13.5px;color:var(--fg);font-family:"JetBrains Mono",monospace}
.key.on{background:var(--solid);color:var(--solid-fg)}
.key svg{width:18px;height:18px}
.key.compose{flex:1.25;background:transparent;border:1px solid var(--input)}

/* System keyboard (drawn by Gboard, shown for context) */
.kbd{flex:none;background:var(--kb);padding:6px 4px 4px;display:flex;flex-direction:column;gap:9px}
.kbd .sugg{height:38px;display:flex;align-items:center;justify-content:space-around;color:var(--muted);font-size:15px;border-bottom:1px solid var(--border);margin:-2px 4px 2px}
.kbd .kr{display:flex;gap:5px;justify-content:center}
.kbd .k{width:35px;height:46px;border-radius:7px;background:var(--kb-key);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--fg)}
.kbd .k.fn{background:var(--kb-fn);font-size:14px}
.kbd .k.w{width:56px}.kbd .k.sp{width:190px}

/* Sheet */
.scrim{position:absolute;inset:0;background:#00000080}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--popover);border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.handle{width:36px;height:4px;border-radius:2px;background:var(--input);margin:10px auto 6px}
.btn{height:44px;border-radius:12px;border:1px solid var(--input);background:transparent;font-size:15px;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.solid{background:var(--solid);color:var(--solid-fg);border-color:var(--solid);font-weight:500}
.field{border-radius:12px;background:var(--canvas);border:1px solid var(--input);padding:12px 14px;font-size:16px;line-height:1.45;min-height:120px}

/* Lock screen */
.lock{background:radial-gradient(120% 70% at 30% 10%,#2a2f3a,#0e1013 70%)}
.clock{font-size:92px;font-weight:400;letter-spacing:-.03em;line-height:1;margin:56px 0 0 32px;color:#eef0f3}
.date{margin:10px 0 0 34px;font-size:16px;color:#c9ccd2}
.notif{margin:0 12px;background:#24262bf2;border-radius:24px;padding:16px 18px;color:#eef0f3;display:flex;flex-direction:column;gap:4px}
.notif .meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#a9adb5}
.notif .meta img{width:18px;height:18px;border-radius:5px}
.notif .t{font-size:16px;font-weight:500}
.notif .b{font-size:14.5px;color:#c4c7cd}

/* Settings-like lists */
.mcard{margin:0 16px 14px;border-radius:16px;background:var(--popover);border:1px solid var(--border);overflow:hidden}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 16px 12px}
.mhead .txt{flex:1;display:flex;flex-direction:column;gap:3px}
.mhead .name{font-size:17px;font-weight:500}
.mhead .sub{font-size:13px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border);font-size:14.5px}
.mrow .lab{flex:1;display:flex;flex-direction:column;gap:2px}
.mrow .lab small{font-size:12.5px;color:var(--dim)}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--input);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted)}
.caption{margin:6px 32px 8px;font-size:12.5px;font-weight:500;color:var(--dim)}
.warn{color:var(--working)}
.dialog{position:absolute;left:20px;right:20px;top:200px;background:var(--popover);border-radius:24px;padding:24px 22px 18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--border)}
.dialog h3{margin:0;font-size:21px;font-weight:600}
.dialog p{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
.fp{font-family:"JetBrains Mono",monospace;font-size:13.5px;line-height:1.6;background:var(--canvas);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--fg);word-break:break-all}
</style>
</head>
<body>
<script>
// ---------- icons (herdr-app icons; claude/codex from defaults/icons) ----------
const ico = {
  claude: '<img class="ic" src="icons/claude.svg" alt="">',
  codex: '<img class="ic" src="icons/codex.svg" alt="">',
  spin: '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.4" stroke-opacity="0.24"/><path d="M12 2.6a9.4 9.4 0 0 1 9.4 9.4"/></svg>',
  server: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="7" rx="2"/><rect x="3.5" y="13" width="17" height="7" rx="2"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  kb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>',
  mic: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  l:'←', d:'↓', u:'↑', r:'→',
};
const sysbar = (t='14:07') => `<div class="sysbar"><span>${t}</span><span class="sysicons"><i style="width:15px;height:11px;clip-path:polygon(0 100%,100% 0,100% 100%)"></i><i style="width:15px;height:11px;border-radius:50% 50% 0 0/100% 100% 0 0;clip-path:polygon(50% 100%,0 0,100% 0)"></i><i style="width:22px;height:11px;border-radius:3px"></i></span></div>`;
const navbar = () => `<div class="navbar"><span></span></div>`;
const st = s => `<span class="st">${s==='working'?ico.spin:`<span class="${s}"></span>`}</span>`;

// ---------- agent data (invented names; no client or real project names) ----------
const row = (a) => `
  <div class="row ${a.s}">
    ${ico[a.p]}
    <div class="txt">
      <span class="name">${a.n}</span>
      <span class="sub">${a.space} · ${a.m}</span>
      ${a.pr!=null?`<div class="bar"><i style="width:${a.pr}%"></i></div>`:''}
    </div>
    ${a.off?'<span class="offline">offline</span>':''}
    <span class="when">${a.w}</span>
    ${st(a.s)}
  </div>`;
const card = (a) => `
  <div class="card">
    <div class="head">
      ${ico[a.p]}
      <div class="txt" style="flex:1;display:flex;flex-direction:column;gap:3px">
        <span style="font-size:16px">${a.n}</span>
        <span style="font-size:13px;color:var(--dim)">${a.space} · ${a.m}</span>
      </div>
      <span style="font-size:13px;color:var(--dim)">${a.w}</span>
    </div>
    <div class="ask"><span class="kind">${a.kind}</span><span class="msg">${a.msg}</span></div>
  </div>`;
const sec = (label, color, n, extra='') => `<div class="sec"><span style="color:var(--${color})">${label}</span><span class="n">${n}</span><span class="grow"></span>${extra}</div>`;

function home(theme){
  return `<div class="phone ${theme}">
    ${sysbar()}
    <div class="top"><h1>Agents</h1>
      <button class="iconbtn" aria-label="Machines">${ico.server}<span class="badge"></span></button>
    </div>
    <div class="notice"><span class="ring"></span><span style="flex:1"><span style="color:var(--fg)">server</span> unreachable · last connected 2h ago</span>${ico.right}</div>
    <div class="list">
      ${sec('Needs you','blocked',2)}
      ${card({p:'claude',n:'docs nav',space:'website',m:'workstation',w:'<1m',kind:'Permission',msg:'Bash: git push origin main'})}
      ${card({p:'codex',n:'api tests',space:'api',m:'workstation',w:'3m',kind:'Question',msg:'Which test runner should I use?'})}
      ${sec('Done','done',1)}
      ${row({p:'codex',n:'og tags',space:'website',m:'workstation',w:'4m',s:'done'})}
      ${sec('Working','working',3)}
      ${row({p:'claude',n:'pricing page',space:'website',m:'workstation',w:'<1m',s:'working',pr:40})}
      ${row({p:'claude',n:'rate limits',space:'api',m:'workstation',w:'6m',s:'working'})}
      ${row({p:'codex',n:'changelog',space:'docs',m:'workstation',w:'9m',s:'working'})}
      ${sec('Idle','dim',2)}
      ${row({p:'claude',n:'readme',space:'docs',m:'workstation',w:'12m',s:'idle'})}
      ${row({p:'claude',n:'backup notes',space:'infra',m:'server',w:'2h',s:'idle',off:true})}
      ${sec('Other terminals','dim',3,`<span style="color:var(--dim)">${ico.right}</span>`)}
    </div>
    ${navbar()}
  </div>`;
}

// ---------- terminal content ----------
function termLines(cols){
  const pad=(s,n)=>s+' '.repeat(Math.max(0,n-[...s].length));
  const box=(lines)=>{const w=cols-2;return [`<span class="c4">╭${'─'.repeat(w)}╮</span>`,...lines.map(([t,cls])=>`<span class="c4">│</span>${cls?`<span class="${cls}">`:''}${pad(t,w)}${cls?'</span>':''}<span class="c4">│</span>`),`<span class="c4">╰${'─'.repeat(w)}╯</span>`];};
  const wide = cols>70;
  const H=[
    ...(wide?[`<span class="c8">&gt;</span> fix the docs nav so the current page is marked, then push`]
        :[`<span class="c8">&gt;</span> fix the docs nav so the current page is marked,`,`  then push`]),
    ``,
    `<span class="c15 bold">●</span> Search<span class="c8">(pattern: "docs-nav", path: "src")</span>`,
    `  <span class="c8">⎿  Found 3 files</span>`,
    ``,
    `<span class="c15 bold">●</span> Read<span class="c8">(src/layouts/Docs.astro)</span>`,
    `  <span class="c8">⎿  Read 57 lines</span>`,
    ``,
    ...(wide?[`<span class="c15 bold">●</span> The nav gets <span class="c6">active</span> from the layout but never uses it.`]
        :[`<span class="c15 bold">●</span> The nav gets <span class="c6">active</span> from the layout but never uses`,`  it.`]),
    ``,
  ];
  const L=[
    ...H,
    `<span class="c15 bold">●</span> Read<span class="c8">(src/components/DocsNav.astro)</span>`,
    `  <span class="c8">⎿  Read 84 lines</span>`,
    ``,
    `<span class="c15 bold">●</span> Update<span class="c8">(src/components/DocsNav.astro)</span>`,
    `  <span class="c8">⎿  Updated with 2 additions and 1 removal</span>`,
    `<span class="c8">      41</span>    &lt;nav class="docs-nav"&gt;`,
    `<span class="bgdel"><span class="c8">      42</span> <span class="c1">-</span>    &lt;a href="/guide"&gt;Guide&lt;/a&gt;${' '.repeat(Math.max(0,cols-40))}</span>`,
    wide?`<span class="bgadd"><span class="c8">      42</span> <span class="c2">+</span>    &lt;a href="/guide" aria-current={active === "guide"}&gt;Guide&lt;/a&gt;${' '.repeat(Math.max(0,cols-74))}</span>`
        :`<span class="bgadd"><span class="c8">      42</span> <span class="c2">+</span>    &lt;a href="/guide"${' '.repeat(Math.max(0,cols-30))}</span>`,
    ...(wide?[]:[`<span class="bgadd"><span class="c8">      43</span> <span class="c2">+</span>      aria-current={active === "guide"}&gt;${' '.repeat(Math.max(0,cols-50))}</span>`]),
    `<span class="c8">      43</span>    &lt;a href="/api"&gt;API&lt;/a&gt;`,
    ``,
    `<span class="c15 bold">●</span> Active link now has aria-current. Build passes.`,
    ``,
    `<span class="c15 bold">●</span> Bash<span class="c8">(git push origin main)</span>`,
    ...box([
      [' Bash command','bold'],
      [''],
      ['   git push origin main'],
      ['   Push the docs nav fix','c8'],
      [''],
      [' Do you want to proceed?'],
      [' ❯ 1. Yes','c4'],
      ['   2. Yes, and don\'t ask again for git push'],
      ['   3. No, and tell Claude what to do differently'],
    ]),
  ];
  return L;
}
function terminal(cols, font, rows=0){
  let lines = termLines(cols);
  if (rows) { while (lines.length < rows) lines.push(''); lines = lines.slice(-rows); }
  const body = lines.map(l=>`<span class="l">${l||' '}</span>`).join('');
  // rows: draw exactly the desk's grid; the space below it is not terminal.
  return rows
    ? `<div class="term" style="font-size:${font}px;flex:none;height:calc(${rows*1.25}em + 6px)">${body}</div><div style="flex:1;background:var(--canvas);border-top:1px dashed var(--border)"></div>`
    : `<div class="term" style="font-size:${font}px;padding-top:6px">${body}</div>`;
}
const ttop = (status='blocked') => `
  <div class="ttop">
    <button class="iconbtn" aria-label="Back" style="color:var(--fg)">${ico.back}</button>
    <img src="icons/claude.svg" style="width:20px;height:20px;margin-right:6px" alt="">
    <div class="txt"><span class="name">docs nav</span><span class="sub">website · workstation</span></div>
    <span class="pill blocked">Needs you</span>
  </div>
  <div class="queue"><b>1 more needs you</b><span class="rest">· next: api tests, question</span>${ico.up}</div>`;

  // Desk terminal 96x44 inside the Mac's terminal padding (10 px sides, 6 px top), fitted: 392 / (96 * 0.6) ≈ 6.8 px.

</div>`;
